train_file: ["/nas/data_2/wanhongz/datasets/DGM4/metadata/train.json"]
val_file: ["/nas/data_2/wanhongz/datasets/DGM4/metadata/val.json"]
bert_config: 'configs/config_bert.json'

image_res: 256
vision_width: 768
embed_dim: 256
vocab_size: 30522
batch_size_train: 16
batch_size_val: 64
temp: 0.07
queue_size: 65536
momentum: 0.995
alpha: 0.4
max_words: 50
label_smoothing: 0.0

loss_MAC_wgt: 0.1
loss_BIC_wgt: 1
loss_bbox_wgt: 0.1
loss_giou_wgt: 0.1
loss_TMG_wgt: 1
loss_MLC_wgt: 1

# 与上次22epoch局部token实验保持一致的主干超参
optimizer: {opt: adamW, lr: 1.25e-6, lr_img: 6.25e-6, weight_decay: 0.02}
schedular: {sched: cosine, lr: 1.25e-6, epochs: 50, min_lr: 1e-7, decay_rate: 1, warmup_lr: 1e-7, warmup_epochs: 10, cooldown_epochs: 0}
